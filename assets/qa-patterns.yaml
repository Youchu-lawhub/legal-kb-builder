# 问答对抽取规则配置
# 供 qa_parser.py 使用
#
# 问答集语料的常见形态：
#   1. 显式标记型：  Q: 问题 / A: 答案  或  问:xxx / 答:xxx
#   2. 编号问答型：  Q1: / A1:  或  1、问：xxx  答：xxx
#   3. Markdown 标题型：### 问题 / ### 答案  或  ## Q1
#   4. 表格型：      | 问题 | 答案 |（Excel/Markdown 表格）
#   5. JSON 型：     [{"question":"...","answer":"..."}]
#   6. 连续段落型：  问句行后紧跟答案段落（需启发式判断）

# ===== 显式标记型问答对 =====
explicit_qa:
  # 问题行匹配（行首，容错全角/半角冒号）
  question_patterns:
    - '(?m)^[\s>]*Q\s*[:：]\s*(.+)$'
    - '(?m)^[\s>]*问\s*[:：]\s*(.+)$'
    - '(?m)^[\s>]*问题\s*[:：]\s*(.+)$'
    - '(?m)^[\s>]*Q\s*(\d+)\s*[:：.、]\s*(.+)$'        # Q1: 内容
    - '(?m)^[\s>]*问\s*(\d+)\s*[:：.、]\s*(.+)$'       # 问1: 内容
    - '(?m)^[\s>]*第\s*(\d+)\s*问\s*[:：]\s*(.+)$'      # 第1问：内容
    - '(?m)^[\s>]*(\d+)\s*[、.．]\s*问\s*[:：]?\s*(.+)$' # 1、问：内容
  # 答案行匹配
  answer_patterns:
    - '(?m)^[\s>]*A\s*[:：]\s*(.+)$'
    - '(?m)^[\s>]*答\s*[:：]\s*(.+)$'
    - '(?m)^[\s>]*答案\s*[:：]\s*(.+)$'
    - '(?m)^[\s>]*解答\s*[:：]\s*(.+)$'
    - '(?m)^[\s>]*回复\s*[:：]\s*(.+)$'
    - '(?m)^[\s>]*A\s*(\d+)\s*[:：.、]\s*(.+)$'
    - '(?m)^[\s>]*答\s*(\d+)\s*[:：.、]\s*(.+)$'
    - '(?m)^[\s>]*答疑意见\s*[:：]\s*(.+)$'
    - '(?m)^[\s>]*答疑意见\s*[:：]$'

# ===== Markdown 标题型 =====
markdown_qa:
  # 标题作为问题，标题下方段落作为答案
  question_heading_patterns:
    - '(?m)^#{1,4}\s*(?:Q&A|FAQ|常见问题|问答)\s*$'  # 父标题
    - '(?m)^#{2,4}\s*(?:Q\s*\d+|问题\s*\d+|问\s*\d+)\s*[:：.、]?\s*(.+)$'
    - '(?m)^#{2,4}\s*(.+？)\s*$'                        # 以问号结尾的标题视为问题
    # 编号标题型：## 1. 标题 / ## 1、标题 / ## 1, 标题（不限是否问号结尾）
    - '(?m)^#{2,4}\s*\d+\s*[.、．,，]\s*(.+)$'
  # 答案分隔标记（出现则答案到此为止）
  answer_end_markers:
    - '(?m)^#{1,4}\s'   # 下一个标题
    - '(?m)^---\s*$'    # 分隔线
  # 智能分段：当标题下方内容含以下标记时，做精细分段
  # 问题 = 标题 + "问题标记"后的详细描述
  # 答案 = "解析/解释标记" + "建议标记" 的组合
  structured_sections:
    question_detail_markers:
      - '(?m)^[\s>]*问题\s*\d*\s*[:：]\s*(.+)$'
    analysis_markers:
      - '(?m)^[\s>]*解析\s*[:：]\s*(.+)$'
      - '(?m)^[\s>]*解释\s*[:：]\s*(.+)$'
      - '(?m)^[\s>]*解答\s*[:：]\s*(.+)$'
    advice_markers:
      - '(?m)^[\s>]*律师建议\s*[:：]\s*(.+)$'
      - '(?m)^[\s>]*建议\s*[:：]\s*(.+)$'
      - '(?m)^[\s>]*实务建议\s*[:：]\s*(.+)$'

# ===== 表格型 =====
table_qa:
  # Markdown 表格表头识别
  header_aliases:
    question: ["问题", "提问", "Q", "Question", "question", "标题"]
    answer: ["答案", "回答", "答复", "答", "A", "Answer", "answer", "解答"]
    category: ["分类", "类别", "标签", "Category", "category", "专题"]
    source: ["来源", "出处", "依据", "Source", "source"]
  # 表格行分隔符
  row_separator: '\|'

# ===== JSON 型 =====
json_qa:
  # 支持的字段名别名
  question_fields: ["question", "q", "问题", "提问", "title", "标题"]
  answer_fields: ["answer", "a", "答案", "回答", "答复", "解答", "content", "内容"]
  category_fields: ["category", "categories", "分类", "类别", "标签", "tag", "tags"]
  source_fields: ["source", "来源", "出处", "依据", "reference", "law", "法律依据"]

# ===== 连续段落型（启发式） =====
heuristic_qa:
  # 判定为"问题行"的启发式规则（同时满足才认）
  question_heuristics:
    min_length: 4              # 问题至少 4 字
    max_length: 120            # 问题不超过 120 字
    must_contain_question_mark: true   # 必须以 ？ 结尾（容错全角）
    must_be_single_line: true          # 必须是单行
  # 答案段落：问题行之后、下一个问题行之前的所有非空行
  answer_max_lines: 80         # 答案最多取 80 行

# ===== 过滤规则 =====
filters:
  # 这些行即使匹配问答标记也丢弃
  discard_patterns:
    - '(?m)^[\s>]*[QＱＡＡ]\s*[:：]\s*$'   # 空问题/空答案
    - '(?i)placeholder'                      # 占位符
    - 'TODO'
    - 'TBD'
  # 答案最小长度（字符）
  min_answer_chars: 2
  # 问题最小长度（字符）
  min_question_chars: 2
  # 去重：问题完全相同则只保留第一条
  dedup_by_question: true

# ===== 元信息抽取（可选） =====
metadata:
  # 尝试从问答文本中抽取以下元信息
  category_patterns:
    - '(?m)^[\s>]*(?:分类|类别|标签|专题)\s*[:：]\s*(.+)$'
  source_patterns:
    - '(?m)^[\s>]*(?:来源|出处|依据|法律依据)\s*[:：]\s*(.+)$'
  tags_patterns:
    - '(?m)^[\s>]*(?:标签|关键词)\s*[:：]\s*(.+)$'
