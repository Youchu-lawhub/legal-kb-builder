# 文档路由规则配置
# 供 material_router.py 使用

# ===== 问答集识别 =====
qa_indicators:
  min_qa_pairs: 3        # 至少识别到 3 个问答对才归类为问答集
  min_density: 0.15      # 问答标记行占非空行的比例阈值
  # 问答标记模式：行首出现以下任一标记，视为一条 Q 或 A 的起始
  question_markers:
    - "^Q[:：]"
    - "^问[:：]"
    - "^问题[:：]"
    - "^Q\\d+[:：.、]"          # Q1: / Q1. / Q1、
    - "^问\\d+[:：.、]"        # 问1: / 问1.
    - "^第\\d+问[:：]"
    - "^\\d+[、.．]\\s*问[:：]?"  # 1、问 / 1. 问
  answer_markers:
    - "^A[:：]"
    - "^答[:：]"
    - "^答案[:：]"
    - "^解答[:：]"
    - "^回复[:：]"
    - "^A\\d+[:：.、]"
    - "^答\\d+[:：.、]"
  # 结构性提示词（出现即增加问答集置信度）
  structural_hints:
    - "FAQ"
    - "常见问题"
    - "问答"
    - "Q&A"
    - "业务咨询"
    - "知识问答"

# ===== 裁判文书识别 =====
judgment_indicators:
  min_matches: 3  # 至少匹配 3 个特征才归类为裁判文书
  patterns:
    - "[（(]\\d{4}[）)][^)]*\\d+号"     # 案号：(2023)京0108民初12345号
    - "本院认为"
    - "判决如下"
    - "裁定如下"
    - "原告.*被告"
    - "审理.*终结"
    - "经审理查明"
    - "诉讼请求"

# ===== 结构化法律书籍识别 =====
structured_book_indicators:
  toc_article_pattern: "第[一二三四五六七八九十百千零\\d]+条"
  toc_chapter_pattern: "第[一二三四五六七八九十百千零\\d]+[章节编]"
  min_toc_entries: 5  # 目录中至少有 5 个同类条目

# ===== 方法论/参考文档识别 =====
methodology_indicators:
  max_pages: 20  # 超过此页数不再考虑为方法论文档
  keywords:
    - "操作指南"
    - "使用说明"
    - "方法论"
    - "工作流"
    - "步骤"
    - "SOP"
    - "流程图"
    - "checklist"

# ===== 文件大小阈值 =====
size_thresholds:
  small: 50      # <= 50 页为小型文档
  large: 500     # > 500 页为大型文档
