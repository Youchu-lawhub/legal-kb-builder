# OCR 字符级别纠错模式
# 用于 text_cleaner.py 的上下文感知 OCR 纠错
#
# 格式说明：
#   character_substitutions: 字符级替换（需要上下文约束，避免误替换）
#     - wrong: 错误字符
#       correct: 正确字符
#       context_before: 前一个字符匹配列表（任一匹配即触发）
#       context_after: 后一个字符匹配列表（任一匹配即触发）
#
#   word_substitutions: 词级替换（无需上下文，直接全文替换）
#     "错误词": "正确词"
#
# 用户可按需扩展此文件，新增模式即时生效，无需修改代码。

# ===== 字符级替换（上下文感知） =====
character_substitutions:

  # ── 己/已/巳 混淆（最常见 OCR 错误之一） ──
  - wrong: "己"
    correct: "已"
    context_before: ["早", "业", "而"]
    context_after: ["经", "知", "付", "有", "被", "是", "在", "成", "定", "然", "久"]

  - wrong: "己"
    correct: "巳"
    context_before: ["癸", "甲", "乙", "丙", "丁", "戊"]

  # ── 日/曰 混淆 ──
  - wrong: "曰"
    correct: "日"
    context_before: ["今", "昨", "明", "每", "当", "即", "近", "某", "同", "翌", "次"]
    context_after: ["期", "前", "后", "内", "起", "止", "常", "益", "趋", "渐"]

  # ── 千/干/于 混淆 ──
  - wrong: "干"
    correct: "千"
    context_before: ["数", "几", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "百"]
    context_after: ["元", "万", "余", "多", "名", "人", "户", "件"]

  - wrong: "干"
    correct: "于"
    context_before: ["对", "关", "属", "由", "基", "鉴", "至", "等", "终", "限", "在", "位"]
    context_after: ["是", "此"]

  # ── 未/末 混淆 ──
  - wrong: "末"
    correct: "未"
    context_after: ["经", "能", "必", "尽", "来", "知", "果", "予", "曾", "遂", "免", "及", "尝"]

  # ── 土/士 混淆 ──
  - wrong: "士"
    correct: "土"
    context_before: ["国", "领", "出"]
    context_after: ["地", "壤", "木", "建"]

  # ── 裁/载 混淆 ──
  - wrong: "载"
    correct: "裁"
    context_before: ["仲", "判", "审", "体", "总", "独"]
    context_after: ["判", "决", "定", "量", "员", "减", "撤"]

  # ── 辩/辨/辫 混淆 ──
  - wrong: "辨"
    correct: "辩"
    context_before: ["答", "抗", "争", "申", "自"]
    context_after: ["护", "论", "称", "解", "驳", "词", "意"]

  - wrong: "辫"
    correct: "辩"
    context_before: ["答", "抗", "争", "申", "自"]
    context_after: ["护", "论", "称", "解", "驳", "词", "意"]

  # ── 侵/浸 混淆 ──
  - wrong: "浸"
    correct: "侵"
    context_after: ["权", "害", "犯", "占", "吞", "蚀"]
    context_before: ["被", "遭", "受"]

  # ── 权/杈 混淆（法律文本高频） ──
  - wrong: "杈"
    correct: "权"
    context_before: ["管辖", "请求", "形成", "抗辩", "抵押", "质", "留置", "债", "物", "人格",
                      "诉讼", "胜诉", "知识产", "所有", "使用", "收益", "处分", "撤销", "解除",
                      "追偿", "代位", "优先受偿", "担保物"]

  # ── 任/壬 混淆 ──
  - wrong: "壬"
    correct: "任"
    context_before: ["责", "担"]
    context_after: ["何", "务", "意", "命", "期", "职"]

  # ── 贵/责 混淆 ──
  - wrong: "贵"
    correct: "责"
    context_before: ["负", "免", "追", "问", "连带", "违约", "侵权", "赔偿"]
    context_after: ["任", "令"]

  # ── 偿/尝 混淆 ──
  - wrong: "尝"
    correct: "偿"
    context_before: ["赔", "补", "清", "代", "追"]

  # ── 效/敖 混淆 ──
  - wrong: "敖"
    correct: "效"
    context_before: ["时", "生", "有", "失", "无"]
    context_after: ["力", "果", "率", "益"]

  # ── 诉/拆 混淆（罕见但存在） ──
  - wrong: "拆"
    correct: "诉"
    context_before: ["起", "上", "申", "控", "告", "反"]
    context_after: ["讼", "求", "请", "状", "称"]


# ===== 词级替换（直接替换，无需上下文） =====
word_substitutions:
  # 法律核心术语
  "损害赔尝": "损害赔偿"
  "缔约过矢": "缔约过失"
  "违约贵任": "违约责任"
  "侵杈贵任": "侵权责任"
  "诉讼时敖": "诉讼时效"
  "诉讼肘效": "诉讼时效"
  "管辖杈": "管辖权"
  "请求杈": "请求权"
  "形成杈": "形成权"
  "抗辫": "抗辩"
  "抗辫杈": "抗辩权"
  "抗辫权": "抗辩权"
  "举证贵任": "举证责任"
  "证明贵任": "证明责任"
  "不当得剥": "不当得利"
  "无因管埋": "无因管理"
  "善意取褐": "善意取得"
  "意思表亦": "意思表示"
  "法律行力": "法律行为"
  "无杈代理": "无权代理"
  "表见代埋": "表见代理"
  "物杈变动": "物权变动"
  "债杈让与": "债权让与"
  "债务承扭": "债务承担"
  "合同解際": "合同解除"
  "诉讼保全": "诉讼保全"
  "强制扦行": "强制执行"
  "仲载": "仲裁"
  "仲载裁决": "仲裁裁决"
