# Regex patterns for judgment element extraction
# Used by judgment_parser.py

case_number:
  patterns:
    - "[（(](\\d{4})[）)]\\s*[\\u4e00-\\u9fa5]+[\\u4e00-\\u9fa5\\d]*\\d+号"
  location: "first_20_lines"

court:
  patterns:
    - "^\\s*([\\u4e00-\\u9fa5]+人民法院)\\s*$"
    - "^\\s*([\\u4e00-\\u9fa5]+仲裁委员会)\\s*$"
  location: "first_10_lines"

procedure:
  indicators:
    一审: ["一审", "初审", "民初", "刑初", "行初"]
    二审: ["二审", "民终", "刑终", "行终", "上诉"]
    再审: ["再审", "民再", "刑再", "民申", "申请再审"]
    执行: ["执", "执异", "执复", "执监"]

section_markers:
  found_facts:
    start:
      - "经审理查明"
      - "经本院审理查明"
      - "经审查查明"
      - "本院经审理查明"
      - "本院经审查查明"
      - "经本院审查"
    end:
      - "本院认为"
      - "以上事实"
      - "上述事实"
      - "上述事实，有"
  court_reasoning:
    start:
      - "本院认为"
      - "本院经审理认为"
      - "本院经审查认为"
    end:
      - "判决如下"
      - "裁定如下"
      - "综上所述.*判决"
      - "据此.*判决"
      - "综上.*裁定"
      - "依照.*判决如下"
  judgment_result:
    start:
      - "判决如下"
      - "裁定如下"
      - "调解协议"
    end:
      - "审判长"
      - "审判员"
      - "人民陪审员"
      - "书记员"
      - "二[○〇OoO0零]"
      - "\\d{4}年\\d{1,2}月\\d{1,2}日"

party_roles:
  - "原告"
  - "被告"
  - "第三人"
  - "上诉人"
  - "被上诉人"
  - "原审原告"
  - "原审被告"
  - "申请人"
  - "被申请人"
  - "申请执行人"
  - "被执行人"
  - "再审申请人"
  - "被申请人"

law_citation_pattern: "《([^》]+)》[\\s]*第[一二三四五六七八九十百千零\\d]+条"

dispute_focus_markers:
  - "本案争议焦点"
  - "双方争议焦点"
  - "本案的争议焦点"
  - "争议焦点为"
  - "归纳.*争议焦点"
